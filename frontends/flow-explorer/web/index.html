<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow Explorer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%237aa2ff'/%3E%3Cpath d='M8 3l5 5-5 5-5-5z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">◆</span>
        <div>
          <strong>Flow Explorer</strong>
          <small>execute uma rota e veja o caminho que ela percorre no backend</small>
        </div>
      </div>
      <div class="status" id="status"></div>
    </header>

    <main class="layout">
      <nav class="sidebar" id="sidebar" aria-label="Rotas e cenários"></nav>

      <section class="center">
        <div class="card request" id="request-card"></div>

        <div class="card diagram-card">
          <div class="player" id="player"></div>
          <div class="lanes-header" id="lanes-header"></div>
          <div class="diagram-scroll" id="diagram-scroll">
            <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </div>

        <div class="card results" id="results"></div>
      </section>

      <aside class="detail" id="detail" aria-label="Detalhe do passo"></aside>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
